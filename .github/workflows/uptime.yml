# Checks the public Deltanium endpoints every 10 minutes. When something is down it opens (or updates) one issue
# labelled "uptime" and assigns the repository owner, so GitHub sends a notification. The issue is closed
# automatically when every check passes again.
# Note: GitHub pauses scheduled workflows after 60 days without repository activity (it emails first);
# re-enable it under Actions -> Uptime if that happens.
name: Uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Add a failing check to test the alert issue"
        type: boolean
        default: false

permissions:
  issues: write
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check endpoints
        id: check
        continue-on-error: true
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure && '1' || '' }}
        run: python3 .github/monitor/check.py
      - name: Open, update or close the alert issue
        uses: actions/github-script@v7
        env:
          FAILED: ${{ steps.check.outcome == 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const failed = process.env.FAILED === 'true';
            const details = fs.existsSync('monitor-result.md') ? fs.readFileSync('monitor-result.md', 'utf8').trim() : '';
            const { owner, repo } = context.repo;
            const open = (await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'uptime' })).data;
            const now = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
            if (failed) {
              const body = `Checks failing at ${now}:\n\n${details}\n\n[Run log](${process.env.RUN_URL})`;
              if (open.length === 0) {
                await github.rest.issues.create({ owner, repo, title: 'Deltanium endpoint down', body,
                  labels: ['uptime'], assignees: ['dungluong'] });
              } else {
                const issue = open[0];
                const comments = (await github.rest.issues.listComments({ owner, repo, issue_number: issue.number, per_page: 100 })).data;
                const last = comments.length ? comments[comments.length - 1].body : issue.body;
                // Comment only when the set of failures changed, so a long outage does not spam.
                if (!last.includes(details)) await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
              }
              core.setFailed('Deltanium endpoints failing');
            } else {
              for (const issue of open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `All checks pass again at ${now}. [Run log](${process.env.RUN_URL})` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              }
            }
